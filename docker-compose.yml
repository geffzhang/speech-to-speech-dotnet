# 首次启动会自动下载并校验默认模型到持久化 models 卷。

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --vad_model_dir
      - /models/vad
      - --stt_model_dir
      - /models/whisper
      - --llm_backend
      - tensorsharp
      - --llm_model_path
      - /models/llm/Qwen3.5-0.8B-Q4_K_M.gguf
      - --tts_model_dir
      - /models/tts
      - --smart_turn_model_path
      - /models/smart-turn/smart-turn-v3.2-cpu.onnx
    expose:
      - 8765/tcp
    ports:
      - 8765:8765/tcp
    volumes:
      - models:/models

volumes:
  models:
