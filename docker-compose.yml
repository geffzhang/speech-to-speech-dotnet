# 与上游 docker-compose.yml 的形态对齐：上游用 llama.cpp server-cuda 容器
# 做 LLM 服务、pipeline 容器跑 serve；C# 侧全 CPU 推理，不需要 GPU reservation。
#
# 用法：
#   1. bash ./download-models.sh --models-dir ./cache/models
#      PowerShell: .\download-models.ps1 -ModelsDir .\cache\models
#      （VAD: silero-vad-v5-onnx；STT: whisper ONNX；LLM: GGUF；
#       TTS: Qwen3-TTS ONNX；SmartTurn: smart-turn-v3.2-cpu.onnx）
#   2. docker compose up --build
#   3. 客户端连 ws://localhost:8765/v1/realtime
#
# LLM 走 chat-completions 后端（OpenAI 兼容）：把 llm_service 换成任何
# 兼容服务（llama.cpp server / vLLM / LM Studio）都可以，只改 base_url。

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --vad_model_dir
      - /models/vad
      - --stt_model_dir
      - /models/whisper
      - --llm_backend
      - chat-completions
      - --llm_base_url
      - http://host.docker.internal:8080
      - --tts_model_dir
      - /models/tts
      - --smart_turn_model_path
      - /models/smart-turn/smart-turn-v3.2-cpu.onnx
    expose:
      - 8765/tcp
    ports:
      - 8765:8765/tcp
    volumes:
      - ./cache/models/:/models/:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
